openapi: 3.1.0
info:
  title: Cadence API
  version: 0.1.0
  summary: Versioned API contract for the Cadence project collaboration platform.
  description: |
    Cadence is a shared project workspace where people and AI operate from the same project context.
    This API is the authoritative application boundary for protected writes. Browser clients may use
    Supabase for authenticated read/realtime flows where allowed by RLS, but protected state changes
    must pass through this API so RBAC, validation, audit, provenance, and module boundaries are enforced.
servers:
  - url: https://api.cadence.example/api/v1
    description: Production placeholder
  - url: https://dev-api.cadence.example/api/v1
    description: Development placeholder
security:
  - bearerAuth: []
tags:
  - name: System
  - name: Identity
  - name: Projects
  - name: Memberships
  - name: Discussion
  - name: Tasks
  - name: Topics
  - name: Decisions
  - name: Blockers
  - name: Milestones
  - name: Files
  - name: Agent
  - name: Notifications
  - name: Activity
  - name: Audit
  - name: Project Health
paths:
  /health:
    get:
      tags: [System]
      operationId: getServiceHealth
      security: []
      summary: Return service health.
      responses:
        '200':
          description: Service health response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /me:
    get:
      tags: [Identity]
      operationId: getCurrentUser
      summary: Return the authenticated Cadence user.
      responses:
        '200':
          $ref: '#/components/responses/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /me/tasks:
    get:
      tags: [Tasks]
      operationId: getMyTasks
      summary: List tasks assigned to the authenticated user.
      parameters:
        - $ref: '#/components/parameters/ProjectIdQuery'
        - $ref: '#/components/parameters/TaskStatusQuery'
        - $ref: '#/components/parameters/OverdueQuery'
        - $ref: '#/components/parameters/LimitQuery'
        - $ref: '#/components/parameters/CursorQuery'
      responses:
        '200':
          description: Task list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /projects:
    get:
      tags: [Projects]
      operationId: listProjects
      summary: List projects available to the authenticated user.
      parameters:
        - $ref: '#/components/parameters/LimitQuery'
        - $ref: '#/components/parameters/CursorQuery'
      responses:
        '200':
          description: Project list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Projects]
      operationId: createProject
      summary: Create a project.
      x-cadence-permission: platform.project_create
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
      responses:
        '201':
          description: Project created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /projects/{projectId}:
    parameters:
      - $ref: '#/components/parameters/ProjectIdPath'
    get:
      tags: [Projects]
      operationId: getProject
      summary: Get project details.
      x-cadence-permission: project.view
      responses:
        '200':
          description: Project details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Projects]
      operationId: updateProject
      summary: Update project metadata.
      x-cadence-permission: project.edit
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProjectRequest'
      responses:
        '200':
          description: Updated project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{projectId}/summary:
    get:
      tags: [Projects]
      operationId: getProjectSummary
      summary: Return workspace summary for the project header and overview.
      x-cadence-permission: project.view
      parameters:
        - $ref: '#/components/parameters/ProjectIdPath'
      responses:
        '200':
          description: Project workspace summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectSummaryResponse'
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{projectId}/lifecycle:
    post:
      tags: [Projects]
      operationId: changeProjectLifecycle
      summary: Change project lifecycle status.
      x-cadence-permission: project.change_lifecycle
      parameters:
        - $ref: '#/components/parameters/ProjectIdPath'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeLifecycleRequest'
      responses:
        '200':
          description: Updated project lifecycle.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{projectId}/members:
    get:
      tags: [Memberships]
      operationId: listProjectMembers
      summary: List project members and roles.
      x-cadence-permission: member.view
      parameters:
        - $ref: '#/components/parameters/ProjectIdPath'
      responses:
        '200':
          description: Membership list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipListResponse'
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Memberships]
      operationId: addProjectMember
      summary: Add a member to the project.
      x-cadence-permission: member.invite
      parameters:
        - $ref: '#/components/parameters/ProjectIdPath'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddMemberRequest'
      responses:
        '201':
          description: Membership created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipResponse'
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /projects/{projectId}/members/{userId}:
    parameters:
      - $ref: '#/components/parameters/ProjectIdPath'
      - $ref: '#/components/parameters/UserIdPath'
    patch:
      tags: [Memberships]
      operationId: changeProjectMemberRole
      summary: Change a project member role.
      x-cadence-permission: member.change_role
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeMemberRoleRequest'
      responses:
        '200':
          description: Membership updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipResponse'
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Memberships]
      operationId: removeProjectMember
      summary: Remove a member from the project.
      x-cadence-permission: member.remove
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Membership removed.
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{projectId}/messages:
    get:
      tags: [Discussion]
      operationId: listProjectMessages
      summary: List current project messages.
      x-cadence-permission: message.view
      parameters:
        - $ref: '#/components/parameters/ProjectIdPath'
        - $ref: '#/components/parameters/LimitQuery'
        - $ref: '#/components/parameters/CursorQuery'
      responses:
        '200':
          description: Message list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageListResponse'
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Discussion]
      operationId: postMessage
      summary: Post a message to a project discussion.
      x-cadence-permission: message.create
      parameters:
        - $ref: '#/components/parameters/ProjectIdPath'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMessageRequest'
      responses:
        '201':
          description: Message created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /messages/{messageId}:
    parameters:
      - $ref: '#/components/parameters/MessageIdPath'
    get:
      tags: [Discussion]
      operationId: getMessage
      summary: Get a message.
      x-cadence-permission: message.view
      responses:
        '200':
          description: Message.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Discussion]
      operationId: editMessage
      summary: Edit the authenticated user's message by creating a new immutable version.
      x-cadence-permission: message.edit_own
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditMessageRequest'
      responses:
        '200':
          description: Updated message.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /messages/{messageId}/history:
    get:
      tags: [Discussion]
      operationId: getMessageHistory
      summary: Get immutable versions for a message.
      x-cadence-permission: message.view
      parameters:
        - $ref: '#/components/parameters/MessageIdPath'
      responses:
        '200':
          description: Message version history.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageHistoryResponse'
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /messages/{messageId}/reactions:
    post:
      tags: [Discussion]
      operationId: addReaction
      summary: Add a reaction to a message.
      x-cadence-permission: message.react
      parameters:
        - $ref: '#/components/parameters/MessageIdPath'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReactionRequest'
      responses:
        '201':
          description: Reaction added.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '403': { $ref: '#/components/responses/Forbidden' }

  /messages/{messageId}/reactions/{reaction}:
    delete:
      tags: [Discussion]
      operationId: removeReaction
      summary: Remove the authenticated user's reaction.
      x-cadence-permission: message.react
      parameters:
        - $ref: '#/components/parameters/MessageIdPath'
        - name: reaction
          in: path
          required: true
          schema: { type: string, maxLength: 32 }
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '204': { description: Reaction removed. }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{projectId}/tasks:
    get:
      tags: [Tasks]
      operationId: listProjectTasks
      summary: List tasks in a project.
      x-cadence-permission: task.view
      parameters:
        - $ref: '#/components/parameters/ProjectIdPath'
        - $ref: '#/components/parameters/TaskStatusQuery'
        - $ref: '#/components/parameters/LimitQuery'
        - $ref: '#/components/parameters/CursorQuery'
      responses:
        '200':
          description: Task list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskListResponse'
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Tasks]
      operationId: createTask
      summary: Create a task.
      x-cadence-permission: task.create
      parameters:
        - $ref: '#/components/parameters/ProjectIdPath'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskRequest'
      responses:
        '201':
          description: Task created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /tasks/{taskId}:
    parameters:
      - $ref: '#/components/parameters/TaskIdPath'
    get:
      tags: [Tasks]
      operationId: getTask
      summary: Get a task.
      x-cadence-permission: task.view
      responses:
        '200':
          description: Task.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Tasks]
      operationId: updateTask
      summary: Update task fields.
      x-cadence-permission-any-of: [task.update_own, task.update_any]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTaskRequest'
      responses:
        '200':
          description: Updated task.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /tasks/{taskId}/assign:
    post:
      tags: [Tasks]
      operationId: assignTask
      summary: Assign or reassign a task.
      x-cadence-permission: task.assign
      parameters:
        - $ref: '#/components/parameters/TaskIdPath'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignTaskRequest'
      responses:
        '200':
          description: Assigned task.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /tasks/{taskId}/complete:
    post:
      tags: [Tasks]
      operationId: completeTask
      summary: Mark a task complete.
      x-cadence-permission-any-of: [task.complete_own, task.complete_any]
      parameters:
        - $ref: '#/components/parameters/TaskIdPath'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Completed task.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /tasks/{taskId}/cancel:
    post:
      tags: [Tasks]
      operationId: cancelTask
      summary: Cancel a task.
      x-cadence-permission: task.cancel_any
      parameters:
        - $ref: '#/components/parameters/TaskIdPath'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Cancelled task.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{projectId}/topics:
    get:
      tags: [Topics]
      operationId: listTopics
      summary: List project topics.
      x-cadence-permission: topic.view
      parameters:
        - $ref: '#/components/parameters/ProjectIdPath'
      responses:
        '200':
          description: Topic list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopicListResponse'
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Topics]
      operationId: createTopic
      summary: Create a topic.
      x-cadence-permission: topic.create
      parameters:
        - $ref: '#/components/parameters/ProjectIdPath'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTopicRequest'
      responses:
        '201':
          description: Topic created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopicResponse'
        '403': { $ref: '#/components/responses/Forbidden' }

  /topics/{topicId}:
    parameters:
      - $ref: '#/components/parameters/TopicIdPath'
    get:
      tags: [Topics]
      operationId: getTopic
      summary: Get a topic.
      x-cadence-permission: topic.view
      responses:
        '200':
          description: Topic.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopicResponse'
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Topics]
      operationId: updateTopic
      summary: Update a topic.
      x-cadence-permission: topic.update
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTopicRequest'
      responses:
        '200':
          description: Updated topic.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopicResponse'
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /topics/{topicId}/status:
    post:
      tags: [Topics]
      operationId: changeTopicStatus
      summary: Change a topic status.
      x-cadence-permission: topic.change_status
      parameters:
        - $ref: '#/components/parameters/TopicIdPath'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: '#/components/schemas/TopicStatus' }
      responses:
        '200':
          description: Updated topic.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopicResponse'
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{projectId}/decisions:
    get:
      tags: [Decisions]
      operationId: listDecisions
      summary: List project decisions.
      x-cadence-permission: decision.view
      parameters:
        - $ref: '#/components/parameters/ProjectIdPath'
      responses:
        '200':
          description: Decision list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionListResponse'
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Decisions]
      operationId: proposeDecision
      summary: Create a proposed decision.
      x-cadence-permission: decision.propose
      parameters:
        - $ref: '#/components/parameters/ProjectIdPath'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDecisionRequest'
      responses:
        '201':
          description: Decision proposed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionResponse'
        '403': { $ref: '#/components/responses/Forbidden' }

  /decisions/{decisionId}:
    get:
      tags: [Decisions]
      operationId: getDecision
      summary: Get a decision.
      x-cadence-permission: decision.view
      parameters:
        - $ref: '#/components/parameters/DecisionIdPath'
      responses:
        '200':
          description: Decision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionResponse'
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /decisions/{decisionId}/confirm:
    post:
      tags: [Decisions]
      operationId: confirmDecision
      summary: Confirm a proposed decision.
      x-cadence-permission: decision.approve
      parameters:
        - $ref: '#/components/parameters/DecisionIdPath'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Confirmed decision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionResponse'
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /decisions/{decisionId}/supersede:
    post:
      tags: [Decisions]
      operationId: supersedeDecision
      summary: Supersede an existing decision with a new decision.
      x-cadence-permission: decision.supersede
      parameters:
        - $ref: '#/components/parameters/DecisionIdPath'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDecisionRequest'
      responses:
        '201':
          description: New decision created and prior decision superseded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionResponse'
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /decisions/{decisionId}/withdraw:
    post:
      tags: [Decisions]
      operationId: withdrawDecision
      summary: Withdraw a decision.
      x-cadence-permission: decision.withdraw
      parameters:
        - $ref: '#/components/parameters/DecisionIdPath'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Withdrawn decision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionResponse'
