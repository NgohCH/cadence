components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Supabase Auth JWT in v0.1; replaceable by Entra-backed identity without changing Cadence RBAC semantics.

  parameters:
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: false
      description: Client-provided correlation UUID. Server creates one if absent and returns it in responses.
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Strongly recommended for retriable protected writes; required for AI proposal confirmation and external integrations in implementation.
      schema: { type: string, minLength: 8, maxLength: 128 }
    ProjectIdPath:
      name: projectId
      in: path
      required: true
      schema: { type: string, format: uuid }
    UserIdPath:
      name: userId
      in: path
      required: true
      schema: { type: string, format: uuid }
    MessageIdPath:
      name: messageId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TaskIdPath:
      name: taskId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TopicIdPath:
      name: topicId
      in: path
      required: true
      schema: { type: string, format: uuid }
    DecisionIdPath:
      name: decisionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    BlockerIdPath:
      name: blockerId
      in: path
      required: true
      schema: { type: string, format: uuid }
    MilestoneIdPath:
      name: milestoneId
      in: path
      required: true
      schema: { type: string, format: uuid }
    FileIdPath:
      name: fileId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ProposalIdPath:
      name: proposalId
      in: path
      required: true
      schema: { type: string, format: uuid }
    NotificationIdPath:
      name: notificationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ProjectIdQuery:
      name: project_id
      in: query
      schema: { type: string, format: uuid }
    TaskStatusQuery:
      name: status
      in: query
      schema: { $ref: '#/components/schemas/TaskStatus' }
    OverdueQuery:
      name: overdue
      in: query
      schema: { type: boolean }
    LimitQuery:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    CursorQuery:
      name: cursor
      in: query
      schema: { type: string }

  responses:
    Unauthorized:
      description: Authentication required or token invalid.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          examples:
            default:
              value:
                success: false
                error:
                  code: UNAUTHENTICATED
                  message: Authentication is required.
                  correlation_id: 8db0cfd6-7d5c-4caa-b704-c43f9e95f8f7
    Forbidden:
      description: Authenticated user lacks the required Cadence permission.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: Resource does not exist or is intentionally hidden from the caller.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ValidationError:
      description: Request failed validation.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Conflict:
      description: Request conflicts with current state or duplicate idempotency key.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    RateLimited:
      description: Request rate limit exceeded.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    UserResponse:
      description: Current user response.
      content:
        application/json:
          schema:
            type: object
            required: [success, data]
            properties:
              success: { const: true }
              data: { $ref: '#/components/schemas/User' }
              meta: { $ref: '#/components/schemas/ResponseMeta' }

  schemas:
    HealthResponse:
      type: object
      required: [success, data]
      properties:
        success: { const: true }
        data:
          type: object
          required: [status]
          properties:
            status: { type: string, enum: [healthy, degraded, unavailable] }
            version: { type: string, examples: ['0.1.0'] }
            timestamp: { type: string, format: date-time }
        meta: { $ref: '#/components/schemas/ResponseMeta' }
    ResponseMeta:
      type: object
      properties:
        correlation_id: { type: string, format: uuid }
